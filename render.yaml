services:
  - type: web
    name: go-gym-track-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_ISSUER
        value: go-gym-track
      - key: JWT_AUDIENCE
        value: go-gym-track-api
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 720h
      - key: COOKIE_SECURE
        value: "true"
      - key: RUN_MIGRATIONS
        value: "false"
